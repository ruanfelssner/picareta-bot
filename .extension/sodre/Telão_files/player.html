  <script>
      ; ((window, red5) => {
        const subscribeContainer = document.querySelector('.subscribe-container')

        const searchParams = new URLSearchParams(window.location.search)
        const query = (param, defaultValue) => {
          return searchParams.has(param) ? searchParams.get(param) : defaultValue
        }

        const RETRY_DELAY = 2000

        const host = query('host', window.location.hostName)
        const app = query('app', 'live')
        const streamName = query('stream_name', 'mystream')
        const apiVersion = query('api_version', 'v1')
        const nodeGroup = query('node_group', 'default')
        const rtaUser = query('rta_user')
        const rtaPass = query('rta_pass')
        const rtaToken = query('rta_token')
        const objectFit = query('object_fit', 'contain')
        const standalone = query('standalone', 'false') === 'true'
        const retry = query('retry', 'true') === 'true'
        const retryDelay = parseInt(query('retry_delay', RETRY_DELAY), 10)

        document.title = streamName
        const ogTitle = document.querySelector('meta[property="og:title"]')
        const ogUrl = document.querySelector('meta[property="og:url"]')
        const canonical = document.querySelector('link[rel="canonical"]')
        if (ogTitle) ogTitle.setAttribute('content', streamName)
        if (ogUrl) ogUrl.setAttribute('content', window.location.href)
        if (canonical) canonical.setAttribute('href', window.location.href)

        let subscriber
        let shuttingDown = false
        const { WHEPClient } = red5

        const configureAuth = params => {
          if (rtaUser && rtaPass) {
            params.user = rtaUser
            params.password = rtaPass
          }
          if (rtaToken) {
            params.token = rtaToken
          }
          return params
        }

        const getConfiguration = () => {
          if (standalone) {
            return {
              endpoint: `https://${host}/${app}/whep/endpoint/${streamName}`,
              streamName,
              connectionParams: configureAuth({})
            }
          }
          // Else, Stream Manager 2.0 integration.
          return {
            endpoint: `https://${host}/as/${apiVersion}/proxy/whep/${app}/${streamName}`,
            streamName,
            connectionParams: configureAuth({
              nodeGroup
            })
          }
        }

        const onSubscriberEvent = event => {
          const { type } = event
          if (type === red5.SubscriberEventTypes.PLAYBACK_TIME_UPDATE) {
            // noisy.
            return
          } else if (
            type === red5.SubscriberEventTypes.CONNECTION_CLOSED ||
            type === red5.SubscriberEventTypes.CONNECT_FAILURE ||
            type === red5.SubscriberEventTypes.PLAY_UNPUBLISH
          ) {
            retrySubscribe()
          }
          console.log('[Subscriber]', type)
        }

        const subscribe = async () => {
          try {
            const config = getConfiguration()
            console.log('config', config)
            subscriber = new WHEPClient()
            subscriber.on('*', onSubscriberEvent)
            await subscriber.init(config)
            await subscriber.subscribe()
          } catch (e) {
            await unsubscribe()
            retrySubscribe()

          }
        }

        const unsubscribe = async () => {
          if (!subscriber) {
            return
          }
          try {
            subscriber.off('*', onSubscriberEvent)
            await subscriber.unsubscribe()
            subscriber = undefined
          } catch (e) {
            // noop.
          }
        }

        const retrySubscribe = () => {
          if (retry && !shuttingDown) {
            let t = setTimeout(async () => {
              clearTimeout(t)
              await subscribe()
            }, retryDelay)
          }
        }

        const start = async () => {
          const videoElement = document.getElementById('red5pro-subscriber')
          videoElement.addEventListener('playing', () => {
            const canvas = document.createElement('canvas')
            canvas.width = videoElement.videoWidth
            canvas.height = videoElement.videoHeight
            const ctx = canvas.getContext('2d')
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height)
            const dataUrl = canvas.toDataURL('image/png')
            videoElement.setAttribute('poster', dataUrl)
          }, { once: true })

          document.querySelectorAll('video').forEach(video => {
            video.style.objectFit = objectFit
          })
          try {
            await subscribe()
            if (window._hsq) window._hsq.push(["trackEvent", { id: "whep_player_start", host: host, app: app, streamName: streamName }])
          } catch (e) {
            alert(`Could not start player: ${e.message}`)
          }
        }

        // Clean up on leave of page.
        window.addEventListener('beforeunload', async () => {
          shuttingDown = true
          await unsubscribe()
        })
        window.addEventListener('pagehide', async () => {
          shuttingDown = true
          await unsubscribe()
        })

        start()
      })(window, window.red5prosdk)
  </script>
